[project]
name = "microbit-swarm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=0.6.23",
    # §5b overlay: the exported deck is a PDF, so the compositing step needs a PDF
    # library. Already installed in this environment; it was simply never declared.
    "pymupdf>=1.24",
    "python-docx>=1.1.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["scripts"]
