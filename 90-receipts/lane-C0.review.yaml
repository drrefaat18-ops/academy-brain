iteration_3:
  verdict: BLOCKED
  reviewer_ran: "python probes yes; pytest no (read-only sandbox has no temp dir)"
  findings:
    - id: C0-11
      severity: high
      result: ACCEPTED
      problem: containment was lexical only; a symlink inside the bundle escapes it.
      fix: >
        _refs() resolves each source file and requires the resolved path to stay
        under the resolved bundle. Regression test added; it skips on Windows
        hosts without the symlink privilege, which is this machine.
    - id: C0-12
      severity: high
      result: ACCEPTED
      problem: >
        a regex can compile, carry exactly one capture group, and still match
        nothing. Schema validation cannot tell that from a working pattern, so a
        typo'd pattern reached PASS with zero references.
      fix: >
        Zero references found while assets/ is non-empty is now a FAIL naming
        misconfiguration as the cause. Deliberately NOT a new config knob: the
        signature of the mistake is already observable. A genuinely empty bundle
        has nothing on disk either and still passes — covered by its own test so
        the rule cannot over-reach.
    - id: C0-13
      severity: high
      result: NOT REPRODUCED (specific claim), PARTLY ACCEPTED (general point)
      evidence: >
        The reviewer stated tests/test_paths.py:7 ALTERNATIVE_CONFIG lacks
        asset_discovery and therefore fails. It carries the section and
        tests/test_paths.py passes 21/21. The reviewer appears to have read a
        pre-fix snapshot.
      accepted_part: >
        The migration hazard itself is real: asset_discovery is required, and
        paths.for_root() calls load_course before constructing anything, so any
        manifest without the section breaks at import. Verified the failure is
        actionable rather than cryptic: "course.yaml: missing field(s):
        asset_discovery". The repo has exactly one manifest and it is migrated.
        Lane E must create the EV3 manifest with the section present.
    - id: C0-14
      severity: low
      result: CONFIRMED — builder's own defect
      evidence: "grep -n 'class DiscoveryError' returned lines 54 and 59."
      cause: >
        A botched string replacement during the claude integration pass left two
        identical class statements. Caught by review, not by the suite — a test
        now asserts the class is declared exactly once.

verification_iteration_3:
  suite: "164 passed, 1 skipped (symlink test skips without the Windows privilege)"
  scenarios: "C0-12 never-matching pattern -> exit 1; empty bundle -> exit 0; real bundle unchanged at 21 present, 1 to create"

# ---------------------------------------------------------------------------
# Iteration 4 — codex ran real probes on the live bundle this time. BLOCKED, 2.
# Both accepted; C0-16 is a correction to the BUILDER's own reasoning.
# ---------------------------------------------------------------------------

iteration_4:
  verdict: BLOCKED
  reviewer_ran: >
    check_assets against the live bundle plus relative, absolute, trailing-separator
    and Windows case-only path spellings (all resolved to the canonical path, exit 0);
    discovery_for with a relative path; traced assets-as-file, non-UTF8, hardlink and
    manifest-inside-bundle paths. pytest again blocked by the read-only sandbox.
    C0-13 was correctly NOT repeated after checking the fixture.
  findings:
    - id: C0-15
      severity: high
      result: ACCEPTED
      problem: >
        assets/ was never validated. It could be a file, a junction to another
        course, or contain directories wearing image names — each SHRINKING the
        set of assets believed to exist, which means fewer dangling references
        and a cleaner-looking gate.
      fix: >
        _assets_on_disk() resolves assets/, requires containment in the bundle,
        requires a directory, and requires every entry to be a regular file whose
        resolved path stays inside. A MISSING assets/ stays legal — an early
        bundle may declare everything to-be-created, and those references still
        surface as TO-CREATE or DANGLING.
    - id: C0-16
      severity: high
      result: ACCEPTED — the builder's own C0-12 fix was wrong on merits
      problem: >
        "zero references + non-empty assets = FAIL" is a heuristic, not an
        invariant. Reviewer pointed at this repo's own L1-s1 assets directory as
        the counterexample; verified — it contains _discover.py, _discover2.py and
        _forensic.py alongside the images. Assets may also be staged before the
        deck cites them. A gate that cries wolf gets switched off, which is its
        own fail-open.
      fix: >
        Inference replaced with declared policy. asset_discovery gains a REQUIRED
        expect_references boolean; the gate enforces only what the course declared.
        Two tests hold both directions, and a third proves the field cannot be
        omitted.
      note: >
        Worth recording: the builder introduced C0-12 while fixing a reviewer
        finding, and it took the next review to catch that the fix itself
        installed a false-positive. Fixes need reviewing exactly as much as the
        original code does.

verification_iteration_4:
  suite: "180 passed, 1 skipped"
  real_bundle: "75-bundle/L1-s1 unchanged: 21 present, 1 to create"

# ---------------------------------------------------------------------------
# Iteration 5 — BLOCKED, 4 findings, all accepted, all fixed.
# ---------------------------------------------------------------------------

iteration_5:
  verdict: BLOCKED
  blocking: 4
  reviewer: codex (read-only sandbox; could not run pytest, and said so)
  root_cause: >
    The lane's fail-closed rule was applied to DISCOVERY but not to the two
    things discovery feeds: what counts as an asset on disk, and what counts as
    a declaration. Both still had a quiet path.
  fixes_applied:
    - finding: C5-01
      action: >
        A broken assets/ symlink was indistinguishable from an absent assets/
        directory, because exists() follows the link. Absent is legal, so the
        bundle audited as all-to-be-created and passed. is_symlink() is now
        checked first and a dangling link raises DiscoveryError.
      verified: >
        By reading, not by execution — creating a symlink on this machine needs
        a privilege the account does not hold (WinError 1314). The regression
        test skips rather than silently passing on such a host.
    - finding: C5-02
      action: >
        "Declared to be created" was a substring scan of the whole SOURCES.md.
        Replaced with _declared_to_create(), which reads only rows in the
        "Assets that must be CREATED" table. No section means nothing declared,
        so unmatched references become DANGLING and the gate fails.
      verified: >
        By execution against the live 75-bundle/L1-s1/SOURCES.md. It lists
        img-05.png at line 25 as an EXISTING reference source, so under the old
        scan a deleted img-05.png was reported as planned work rather than as a
        broken reference. The new parser returns exactly the 7 real to-create
        rows and does not contain img-05.png.
    - finding: C5-03
      action: >
        asset_source_files entries were hashed for duplicate detection before
        being type-checked, so a YAML mapping raised an unhashable-type
        TypeError from inside the validator and made the validator's own error
        branch unreachable. Entries are type-checked first.
      verified: "By execution — reproduced TypeError: unhashable type: 'dict'."
    - finding: C5-04
      action: >
        resolved.iterdir() sat outside the per-entry try, so an OSError from
        listing the directory escaped the CLI as a raw traceback instead of a
        controlled gate failure. Listing is now wrapped.
      verified: "By execution, monkeypatching Path.iterdir to raise OSError."
  suite: "187 passed, 2 skipped"
  reviewer_quality_note: >
    C5-02 is the one that mattered. It is the same defect the lane has been
    rejected for four times — a check that passes on the strength of a string
    appearing somewhere — and it survived four rounds because the phrase
    "declared in SOURCES.md" sounded like a check. The reviewer found it by
    asking what a declaration IS, which no amount of re-reading the code does.

# ---------------------------------------------------------------------------
# Round 7 (iteration 6) - final-pass cross-model review. 1 finding, accepted,
# fixed by opencode, independently verified by claude (grep + full pytest).
# ---------------------------------------------------------------------------

iteration_6:
  verdict: BLOCKED
  blocking: 1
  builder: opencode
  reviewer: cross-model final pass
  findings:
    - id: C0-17
      severity: high
      problem: >
        discovery_for()'s ancestor walk used manifest.is_file(), which follows
        symlinks. A manifest that is a broken symlink reads exactly like an
        absent manifest, so the walk continued upward and silently adopted an
        ancestor course's naming/expect_references instead of failing.
      fix: >
        The walk now checks manifest.exists() first; if false AND the path
        is_symlink(), it raises DiscoveryError naming the dangling link instead
        of continuing upward. A manifest that exists but is not a regular
        file, or that cannot be inspected (OSError), also raises rather than
        continuing. Genuinely absent (no file, no symlink) still continues.
  verified_by_claude:
    method: >
      grep against live scripts/swarm/check_assets.py confirming the
      three-way branch (absent -> continue; symlink -> DiscoveryError; not a
      file / OSError -> DiscoveryError), plus full local pytest run.
  suite: "208 passed, 4 skipped"
