scope_note: >
  Iteration 3 was taken over by claude rather than returned to opencode. The
  decisive finding (C0-08) required editing scripts/swarm/config.py, which is
  lane B's file and outside C0's ownership. The matrix rule says a lane needing
  another lane's file must STOP, so the fix could not be done inside C0 at all.
  Integration is claude's; the takeover follows the rule rather than bypassing it.

iteration_2_findings:
  resolved_by_review:
    - id: C0-01
      note: signature regression gone; audit(bundle)/unused(bundle) are one-arg again.
    - id: C0-02
      note: definition-time binding gone for direct callers; module globals steer again.
  blocking:
    - id: C0-03
      problem: no course.yaml anywhere -> silent micro:bit defaults -> PASS on an unaudited course.
    - id: C0-04
      problem: tests asserted the forbidden outcome (green pass on undiscovered course).
    - id: C0-06
      problem: manifest present but without asset_discovery -> same silent default.
    - id: C0-07
      problem: a typo'd source filename was skipped, turning the audit into an empty pass.
    - id: C0-08
      problem: >
        two parsers for one file. check_assets accepted an asset_discovery section
        that config.load_course rejected as an unknown field, so the documented
        configuration broke the canonical loader.
    - id: C0-09
      problem: a multi-group regex makes findall() return tuples; the audit dies with TypeError.
    - id: C0-10
      problem: source paths were not contained; '../../other/deck.md' audits another course.

verified_by_claude:
  method: executed, not read
  results:
    - id: C0-08
      result: CONFIRMED
      evidence: >
        Appended the documented asset_discovery section to a copy of the repo's own
        course.yaml; load_course raised
        "CourseConfigError: unknown field(s): asset_discovery".
    - id: C0-09
      result: CONFIRMED
      evidence: >
        Pattern '`((shot|render)-([^.]+)\.(png|svg))`' against a deck referencing
        shot-arm.png raised
        "TypeError: 'in <string>' requires string as left operand, not tuple".
    - id: C0-07
      result: CONFIRMED
      evidence: "asset_source_files: [dekk.md] with a real deck.md -> exit 0, 'PASS: 0 present, 0 to create'."
    - id: C0-06
      result: CONFIRMED — independently found by claude before reading the review.

fixes_applied:
  - finding: C0-08
    action: >
      asset_discovery moved into the canonical schema in scripts/swarm/config.py as a
      REQUIRED field with a validated AssetDiscovery dataclass. check_assets.py's
      duplicate parser (_manifest_section) was deleted; discovery_for() now walks up to
      the nearest course.yaml and calls load_course. One file, one set of rules.
  - findings: [C0-03, C0-06]
    action: >
      Discovery has no default and no fallback. A missing manifest raises DiscoveryError;
      a manifest without asset_discovery is a missing-field error. Both exit 2. The
      repo's own course.yaml now declares its micro:bit discovery explicitly, so the
      previously implicit default is written down rather than assumed.
  - finding: C0-07
    action: _refs() raises DiscoveryError naming every configured source file not on disk.
  - finding: C0-09
    action: >
      config.py rejects any asset_ref_pattern whose group count is not exactly 1,
      with the group count in the message. Refused at load, not mid-audit.
  - finding: C0-10
    action: >
      asset_source_files entries are validated as single file names inside the bundle;
      absolute paths and '..' are refused at load time, so the gate cannot be aimed at
      another course.
  - finding: C0-04
    action: >
      tests/test_check_assets.py rewritten. The tests that blessed the green-pass
      outcome now assert exit 2. 24 tests, including one per blocking finding and a
      nearest-manifest-wins case.

verification:
  suite: 161 passed
  self_checks: [check_assets, generate_session, overlay]
  scenarios_rerun: >
    All five reported failure scenarios were re-executed after the fix and every one
    exits 2 with a specific diagnostic. The positive case still fails correctly on a
    real dangling reference (exit 1).
  real_bundle: >
    75-bundle/L1-s1 unchanged before and after: 21 present, 1 to create, 1 unused.
    The fix is not a behaviour change for the live course.

graduation_note: >
  Still NOT GRANTED, and now on evidence rather than deferral. opencode produced the
  same class of defect twice: when discovery could not be resolved it fell back to
  another course's naming and reported success. Iteration 1 failed open at
  definition-time binding; iteration 2 failed open at three separate fallback
  conditions, and its own tests asserted that failure as correct behaviour. A builder
  whose tests bless the defect the lane exists to prevent does not get shared
  infrastructure. Revisit on a lane where the brief is not defective.

# ---------------------------------------------------------------------------
# Iteration 3 review — codex ran probes this time (confirmed non-capturing and
# named groups are accepted, and that '((?!))' has one group and matches
# nothing). Still BLOCKED: 3 real, 1 not reproduced.
# ---------------------------------------------------------------------------

iteration_3:
  verdict: BLOCKED
  reviewer_ran: "python probes yes; pytest no (read-only sandbox has no temp dir)"
  findings:
    - id: C0-11
      severity: high
      result: ACCEPTED
      problem: containment was lexical only; a symlink inside the bundle escapes it.
      fix: >
        _refs() resolves each source file and requires the resolved path to stay
        under the resolved bundle. Regression test added; it skips on Windows
        hosts without the symlink privilege, which is this machine.
    - id: C0-12
      severity: high
      result: ACCEPTED
      problem: >
        a regex can compile, carry exactly one capture group, and still match
        nothing. Schema validation cannot tell that from a working pattern, so a
        typo'd pattern reached PASS with zero references.
      fix: >
        Zero references found while assets/ is non-empty is now a FAIL naming
        misconfiguration as the cause. Deliberately NOT a new config knob: the
        signature of the mistake is already observable. A genuinely empty bundle
        has nothing on disk either and still passes — covered by its own test so
        the rule cannot over-reach.
    - id: C0-13
      severity: high
      result: NOT REPRODUCED (specific claim), PARTLY ACCEPTED (general point)
      evidence: >
        The reviewer stated tests/test_paths.py:7 ALTERNATIVE_CONFIG lacks
        asset_discovery and therefore fails. It carries the section and
        tests/test_paths.py passes 21/21. The reviewer appears to have read a
        pre-fix snapshot.
      accepted_part: >
        The migration hazard itself is real: asset_discovery is required, and
        paths.for_root() calls load_course before constructing anything, so any
        manifest without the section breaks at import. Verified the failure is
        actionable rather than cryptic: "course.yaml: missing field(s):
        asset_discovery". The repo has exactly one manifest and it is migrated.
        Lane E must create the EV3 manifest with the section present.
    - id: C0-14
      severity: low
      result: CONFIRMED — builder's own defect
      evidence: "grep -n 'class DiscoveryError' returned lines 54 and 59."
      cause: >
        A botched string replacement during the claude integration pass left two
        identical class statements. Caught by review, not by the suite — a test
        now asserts the class is declared exactly once.

verification_iteration_3:
  suite: "164 passed, 1 skipped (symlink test skips without the Windows privilege)"
  scenarios: "C0-12 never-matching pattern -> exit 1; empty bundle -> exit 0; real bundle unchanged at 21 present, 1 to create"
