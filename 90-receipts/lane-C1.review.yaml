# First review of this lane. It found, in the builder's own fail-closed gate,
# the exact defect class the builder had spent three rounds blocking in others.

verified_by_builder:
  - id: C1-01
    result: CONFIRMED — reproduced
    evidence: >
      Built a PDF, applied the redaction, skipped the insert (what an interrupted
      run leaves behind), then called assert_filled. It PASSED with zero images
      embedded. find_regions returned [] because the marker really was gone.
      Marker absence was being treated as proof of image presence.
  - id: C1-03
    result: CONFIRMED
    evidence: >
      The check was `"approved" not in state.lower()`. Both "unapproved" and
      "not-approved" CONTAIN "approved", so both satisfied the approval gate.

fixes_applied:
  - findings: [C1-01, C1-14]
    action: >
      assert_filled takes the expected asset map and verifies embedded images are
      PRESENT, not merely that markers are absent. _composite passes it on both the
      fresh-download and skip paths. A redaction-only deck now fails with an
      explicit instruction to delete and regenerate.
  - finding: C1-03
    action: status must equal "approved" exactly, parsed from front matter.
  - finding: C1-04
    action: >
      approval.kind is read from the approval mapping inside bounded YAML front
      matter. The previous loose ^\s*kind: search matched the first kind: anywhere
      in the document, so unrelated metadata satisfied a gate whose entire purpose
      is establishing WHO approved it.
  - finding: C1-05
    action: >
      Legacy gap marker matched case-insensitively across any dash form, spacing
      and indentation. "Gap - owner must decide" and the en-dash variant used to
      ship as settled content.
  - finding: C1-06
    action: >
      _evidence_map canonicalises ids and refuses duplicates naming both rows.
      The dict comprehension it replaced let the last duplicate silently win.

remaining:
  - ids: [C1-02]
    what: >
      Region discovery depends on the rendered text layer matching one exact
      marker grammar. A renderer that wraps, reorders or substitutes glyphs makes
      a region invisible. Partly mitigated: the image-count check now catches the
      common consequence, but not a deck where SOME regions are invisible and
      others filled.
    why_deferred: >
      The real fix is a region manifest emitted at generation time and checked
      against the export. That is a design change to the generation contract, not
      a patch, and no live run exists yet to validate it against.
  - ids: [C1-07, C1-08]
    what: reconciliation is one-directional and recognises only one heading/asset syntax.
  - ids: [C1-09]
    what: a marker wrapped across a line yields multiple rects and is refused as a collision. Fails closed, but wrongly.
  - ids: [C1-10]
    what: write_receipt hardcodes 90-receipts instead of using lane B's CoursePaths.
  - ids: [C1-11, C1-12, C1-13]
    what: >
      test coverage gaps — rotated pages, wrapped markers, and the typed-approval
      contracts that live only in _demo(). Partly closed: 11 new collected tests
      now cover the criticals, duplicate ids, exact status, bounded kind lookup
      and every legacy-gap spelling.

reviewer_quality_note: >
  The most valuable review of the three lanes. C1-01 is the builder's own
  standard turned on the builder: three rounds were spent blocking opencode for
  gates that reported success without checking, and this gate did the same thing
  in a different costume. It was found by reasoning about interrupted runs, not
  by running the suite — the reviewer could not run pytest at all.

# ---------------------------------------------------------------------------
# Iteration 5 — BLOCKED, 4 findings (2 blocking, 2 test coverage). All fixed.
# ---------------------------------------------------------------------------

iteration_5:
  verdict: BLOCKED
  blocking: 2
  non_blocking: 2
  reviewer: codex (read-only sandbox; could not run pytest, and said so)
  root_cause: >
    Iteration 4 replaced a marker-absence proof with an image-COUNT proof. The
    count is a document-wide total, so it is not a proof about the expected
    assets at all — it is the same defect one level up, and it was introduced by
    the fix for that defect.
  fixes_applied:
    - finding: C1-5-01
      action: >
        assert_filled compared the total number of embedded images against the
        number of expected assets. Any deck carrying brand chrome or a mascot
        already clears that count, so an interrupted run that redacted every
        marker and inserted nothing still passed. overlay() now records the ids
        it actually placed into the PDF metadata, and assert_filled requires a
        record for each expected asset. Proof per asset, not per document.
      verified: >
        By construction. The interrupted-run fixture now embeds decoy images
        first; the old check passes on it (3 images >= 1 expected) and the new
        one raises. Both directions are covered — a properly overlaid deck must
        still pass, and does.
    - finding: C1-5-02
      action: >
        The duplicate-id hard stop lived only in _evidence_map, which sees one
        pass's evidence subset. A collision between two REFERENCE rows, or
        across two passes, cleared preflight entirely and was settled by
        whichever row parsed last. The check moved into enforce_asset_gate, over
        every row, canonicalised (strip + casefold), naming both slides and both
        filenames.
      verified: >
        By execution, and against the live 75-bundle/L1-s1/ASSET-MAPPING.md —
        22 rows, no duplicates, so the new check does not break the real file.
    - finding: C1-5-03
      action: >
        Accepted. The interrupted-run regression test used a PDF with zero
        images, so it never exercised the masking case. The fixture takes a
        decoys argument and the new test embeds three.
    - finding: C1-5-04
      action: >
        Accepted in substance: a gate-level duplicate test now exists over
        REFERENCE rows through enforce_asset_gate. The reviewer additionally
        asked for row NUMBERS in the message; the message names the slide and
        the filename of both rows instead, which identifies them for a human
        without threading a row index through parse_asset_mapping. Recorded as a
        deliberate deviation, not an oversight.
  suite: "187 passed, 2 skipped"
  reviewer_quality_note: >
    Second round running in which the reviewer's best finding is a defect in the
    previous round's FIX. The pattern is now established well enough to state as
    a rule: a fix for a fail-open is itself a prime suspect for a fail-open,
    because it is written under the assumption that the author now understands
    the defect.

# ---------------------------------------------------------------------------
# Round 7 (iteration 6) - final-pass cross-model review. 1 finding, accepted,
# fixed by opencode, independently verified by claude (grep + full pytest).
# ---------------------------------------------------------------------------

iteration_6:
  verdict: BLOCKED
  blocking: 1
  builder: opencode
  reviewer: cross-model final pass
  findings:
    - id: C1-6-01
      severity: high
      problem: >
        overlay.py's assert_filled() proved a placement survived only by
        checking the xref's membership in page.get_images(full=True). A
        redaction (add_redact_annot + apply_redactions with
        PDF_REDACT_IMAGE_REMOVE) can leave the xref listed in page resources
        while the drawn instance is gone, so a blanked-out placement still
        counted as present.
      fix: >
        assert_filled() now additionally requires
        page.get_image_rects(xref) to be non-empty for the recorded page. An
        xref listed but with no placement rect is reported as gone, naming
        the page and xref.
  verified_by_claude:
    method: >
      grep against live scripts/swarm/overlay.py confirming the added
      get_image_rects() check; new regression test in tests/test_overlay.py
      (content-stream blanking, not full redaction, since redaction removes
      the resource entry outright) re-run; full local pytest run.
  suite: "208 passed, 4 skipped"
